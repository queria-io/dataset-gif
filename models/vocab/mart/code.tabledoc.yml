$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: コード一覧
description: |-
  GIF のコアデータモデルが形式として使うコード一覧です。1 行が 1 コード一覧の 1 値です。

  - vocab.term の format が「pcd:性別コード一覧（コード）」のように指すのがこの一覧です
sources:
  - id: '430_'
    path: https://github.com/digital-go-jp/GIF/tree/main/430_コアデータモデル
columns:
  - name: version
    title: バージョン
  - name: source_path
    title: 取り込み元のファイル
  - name: code_list_no
    title: コード一覧番号
  - name: code_list_name
    title: コード一覧名称
  - name: code_list_name_en
    title: コード一覧名称（英語）
  - name: code_list_description
    title: コード一覧の説明
    description: コード一覧そのものの説明。準拠する規格や出典
  - name: code
    title: コード
    description: Code 値。数字も文字列で持ちます
  - name: value
    title: 名称
    description: Value 値
  - name: description
    title: 説明
    description: 値ごとの説明
  - name: source_sheet
    title: 元のシート
    description: この行を読んだ Excel のシート名です
  - name: source_row
    title: 元の行番号
    description: この行を読んだシートの行番号です（Excel の行番号と同じ、1 始まり）
  - name: source_sha256
    title: 元のファイルの SHA-256
    description: この行を読んだファイルの SHA-256 です。source_file の sha256 に当たります
