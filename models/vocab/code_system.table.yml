schema: vocab
name: code_system
title: 行政のコード体系
description: |-
  行政が使うコード・ID の体系を、分野ごとに一覧にしたものです。1 行が 1 コード体系で、名前・説明・公表組織とコード表の URL を持ちます。

  - コードの値そのものは持ちません
  - 原典はデジタル庁が検索で集めたもので、網羅的ではありません
sources:
  - path: https://github.com/digital-go-jp/GIF/tree/main/490_その他
fields:
  - name: version
    title: バージョン
  - name: source_path
    title: 取り込み元のファイル
  - name: field
    title: 分野
    description: 原典のシート名。個人・法人・行政・住所・地域・国土・医療など
  - name: item_number
    title: 分野内の番号
    description: 分野の中の並び順。取り込み時に振り直しています
  - name: category
    title: 分類
  - name: name
    title: 名前
  - name: data_url
    title: データの URL
    description: コード表の URL。「非公開」など URL でない値もあります
  - name: data_format
    title: データ形式
  - name: description
    title: 説明
  - name: web_page
    title: 公開ウェブページ
  - name: publisher
    title: 公表組織名
