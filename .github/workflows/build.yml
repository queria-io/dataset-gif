name: Build

# 公開せずにパイプラインと dbt build だけを回す。GIF の Excel の形が変わったときに
# Sync より先に気づくため
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import logging; logging.basicConfig(level=logging.INFO, format='%(message)s'); from pipelines.gif import download_gif; download_gif()"
      - run: uv run dbt build --profiles-dir ci
