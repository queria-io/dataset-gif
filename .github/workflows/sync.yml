name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 毎月 3 日 05:00 JST。GIF の版上げは年に数回
    - cron: "0 20 2 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@2e64ee1015e700475c47c1c584d86cf08e8922dd
    with:
      dataset_name: gif
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
