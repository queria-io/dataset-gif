# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: gif
title: 政府相互運用性フレームワーク（GIF）
description: |-
  デジタル庁の政府相互運用性フレームワーク（GIF）が定める語彙です。データの項目名・英語名・形式と、コード一覧、行政が使うコード体系の一覧を収録し、毎月 GIF の最新のバージョンから取得し直します。

  出典：デジタル庁「政府相互運用性フレームワーク（GIF）」。Queria が加工したものです。
keywords:
  - 語彙
  - メタデータ
  - データ標準
  - コード
  - データモデル
  - デジタル庁
  - GIF
  - 政府相互運用性フレームワーク
homepage: https://github.com/queria-io/dataset-gif
language: ja

licenses:
  - CC-BY-4.0

sources:
  - title: デジタル庁 政府相互運用性フレームワーク（GIF）
    path: https://www.digital.go.jp/policies/data_strategy_government_interoperability_framework
  - title: digital-go-jp/GIF
    path: https://github.com/digital-go-jp/GIF

contributors:
  - title: デジタル庁
    path: https://www.digital.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: vocab
    title: 語彙

annotations:
  queria:
    themes: [other]
    cover: 📖
...
